name: Flutter Build Fixed

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

env:
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "2024.01.12"
  VERSION: ${{ github.ref_name }}

jobs:
  # Windows x86_64 构建
  build-for-windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          # 安装必要的构建工具
          choco install llvm cmake ninja nasm python -y

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.81"
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if (! $env:VCPKG_ROOT\vcpkg install --x-install-root="$env:VCPKG_ROOT\installed") {
            Get-ChildItem -Path "$env:VCPKG_ROOT\" -Filter "*.log" -Recurse | ForEach-Object {
              Write-Host "$($_.FullName):"
              Write-Host "======"
              Get-Content $_.FullName
              Write-Host "======"
              Write-Host ""
            }
            exit 1
          }

      - name: Generate bridge
        run: |
          cd flutter
          dart run ffigen --config ffigen.yaml
          cd ..

      - name: Build rustdesk
        run: |
          python build.py --flutter --hwcodec --unix-file-copy-paste

      - name: Upload Windows app
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-windows-x86_64-fixed
          path: flutter/build/windows/x64/runner/Release/rustdesk.exe

  # macOS ARM64 构建
  build-for-macOS:
    name: macOS ARM64
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clear problematic caches
        run: |
          brew cleanup
          flutter clean
          cargo clean

      - name: Install build runtime
        run: |
          # 先卸载可能存在的cmake
          brew uninstall cmake --ignore-dependencies || true
          # 安装构建工具
          brew install llvm create-dmg nasm cmake gcc wget ninja
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.81"
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - name: Generate bridge
        run: |
          cd flutter
          dart run ffigen --config ffigen.yaml
          cd ..

      - name: Build rustdesk
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Fix Flutter framework embedding
        run: |
          # 确保Flutter框架被正确嵌入
          if [ -d "./flutter/build/macos/Build/Products/Release/RustDesk.app" ]; then
            # 检查Flutter框架是否存在
            if [ ! -d "./flutter/build/macos/Build/Products/Release/RustDesk.app/Contents/Frameworks/FlutterMacOS.framework" ]; then
              echo "FlutterMacOS.framework not found, copying from Flutter installation"
              # 从Flutter安装目录复制框架
              FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
              
              # 使用ARM64框架路径
              FRAMEWORK_PATH="$FLUTTER_ROOT/bin/cache/artifacts/engine/darwin-arm64/FlutterMacOS.framework"
              
              # 检查源框架是否存在
              if [ ! -d "$FRAMEWORK_PATH" ]; then
                echo "Error: Flutter framework not found at $FRAMEWORK_PATH"
                echo "Available frameworks:"
                ls -la "$FLUTTER_ROOT/bin/cache/artifacts/engine/" || true
                exit 1
              fi
              
              # 确保目标目录存在
              mkdir -p "./flutter/build/macos/Build/Products/Release/RustDesk.app/Contents/Frameworks/"
              
              # 复制框架
              cp -R "$FRAMEWORK_PATH" \
                "./flutter/build/macos/Build/Products/Release/RustDesk.app/Contents/Frameworks/"
              
              echo "FlutterMacOS.framework copied successfully"
            else
              echo "FlutterMacOS.framework already exists"
            fi
            # 验证框架是否正确嵌入
            ls -la "./flutter/build/macos/Build/Products/Release/RustDesk.app/Contents/Frameworks/"
          else
            echo "Error: RustDesk.app not found"
            exit 1
          fi

      - name: create unsigned dmg
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-aarch64.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app

      - name: Upload macOS app
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-macos-aarch64-fixed
          path: rustdesk-${{ env.VERSION }}-aarch64.dmg